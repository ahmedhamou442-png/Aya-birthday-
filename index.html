<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aya 💖</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: sans-serif;
    background: black;
    color: white;
}

/* INTRO */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
}

#intro h1 {
    font-size: 3em;
    opacity: 0;
    animation: fadeIn 2s forwards;
}

#intro p {
    opacity: 0;
    animation: fadeIn 2s 2s forwards;
}

@keyframes fadeIn {
    to {opacity: 1;}
}

/* MAIN */
.container {
    display: none;
    width: 100%;
    height: 100vh;
    background: radial-gradient(circle, #ff9a9e, #c084fc, #1a1a2e);
    text-align: center;
}

/* Gift */
.gift {
    position: relative;
    width: 120px;
    height: 120px;
    margin: auto;
    margin-top: 150px;
    cursor: pointer;
}

.box {
    width: 100%;
    height: 100%;
    background: #ff4b8b;
    border-radius: 10px;
}

.lid {
    width: 120px;
    height: 40px;
    background: #ff1e6c;
    position: absolute;
    top: -40px;
    transition: transform 0.8s;
    transform-origin: bottom;
}

.ribbon {
    width: 20px;
    height: 120px;
    background: white;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
}

/* Hearts */
.heart {
    position: absolute;
    font-size: 20px;
    animation: float 3s ease-out forwards;
}

@keyframes float {
    to {
        transform: translateY(-200px) scale(1.5);
        opacity: 0;
    }
}

/* Open */
.gift.open .lid {
    transform: rotate(-120deg);
}

/* Text */
h2 {
    margin-top: 30px;
}

/* Button */
button {
    padding: 10px 20px;
    border: none;
    border-radius: 20px;
    background: #ff4b8b;
    color: white;
    margin-top: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- INTRO -->
<div id="intro">
    <h1>Aya 💖</h1>
    <p>عندي ليك مفاجأة خاصة...</p>
</div>

<!-- MAIN -->
<div class="container" id="main">

    <h2>🎁 حلّي الهدية</h2>

    <div class="gift" onclick="openGift()">
        <div class="lid"></div>
        <div class="box"></div>
        <div class="ribbon"></div>
    </div>

    <h2 id="msg" style="opacity:0;">🎉 عيد ميلاد سعيد Aya 💖</h2>

</div>

<audio autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<script>
/* INTRO TIMING */
setTimeout(()=>{
    document.getElementById("intro").style.display="none";
    document.getElementById("main").style.display="block";
},4000);

/* GIFT OPEN */
function openGift(){
    let gift = document.querySelector(".gift");
    let msg = document.getElementById("msg");

    gift.classList.add("open");

    /* Hearts explosion */
    for(let i=0;i<30;i++){
        let h=document.createElement("div");
        h.classList.add("heart");
        h.innerHTML="💖";

        h.style.left="50%";
        h.style.top="50%";

        let x=(Math.random()-0.5)*200;
        let y=(Math.random()-1)*200;

        h.style.transform=`translate(${x}px, ${y}px)`;

        document.body.appendChild(h);

        setTimeout(()=>h.remove(),3000);
    }

    setTimeout(()=>{
        msg.style.opacity=1;
    },800);
}
</script>

</body>
</html>
